name: CurveReceipt browser journey
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tests/browser/**'
      - 'proof/public-links.mjs'
      - '.github/workflows/browser.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/browser/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/browser.yml'

permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify public submission links and exact demonstration bytes
        run: node proof/public-links.mjs
      - run: npx playwright install --with-deps chromium
      - name: Run real browser journey without mocked RPC data
        run: npx playwright test
      - name: Save browser videos, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curve-receipt-browser-proof
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
      - name: Save a compact standalone demonstration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curve-receipt-demo
          path: |
            test-results/demo-*/video.webm
            test-results/demo-timeline.json
            test-results/mainnet-desktop.png
            test-results/mainnet-mobile.png
          if-no-files-found: error

